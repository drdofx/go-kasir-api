openapi: 3.0.3
info:
  title: Go Kasir API
  version: 1.0.0
  description: Simple cashier API for product CRUD.
servers:
  - url: /
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: API Running
  /api/products:
    get:
      tags:
        - Products
      summary: Get all products
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      tags:
        - Products
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid request
          content:
            text/plain:
              schema:
                type: string
  /api/products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product ID
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Product not found
          content:
            text/plain:
              schema:
                type: string
    put:
      tags:
        - Products
      summary: Update product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid request
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Product not found
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags:
        - Products
      summary: Delete product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid product ID
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Product not found
          content:
            text/plain:
              schema:
                type: string
  /categories:
    get:
      tags:
        - Categories
      summary: Get all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      tags:
        - Categories
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Invalid request
          content:
            text/plain:
              schema:
                type: string
  /categories/{id}:
    get:
      tags:
        - Categories
      summary: Get category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Invalid category ID
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Category not found
          content:
            text/plain:
              schema:
                type: string
    put:
      tags:
        - Categories
      summary: Update category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Invalid request
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Category not found
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags:
        - Categories
      summary: Delete category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid category ID
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Category not found
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
        - stock
        - category_id
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Instant Noodles
        price:
          type: integer
          example: 3500
        stock:
          type: integer
          example: 10
        category_id:
          type: integer
          example: 2
        category_name:
          type: string
          example: Beverages
    ProductInput:
      type: object
      required:
        - name
        - price
        - stock
        - category_id
      properties:
        name:
          type: string
          example: Coffee
        price:
          type: integer
          example: 2500
        stock:
          type: integer
          example: 200
        category_id:
          type: integer
          example: 2
    Category:
      type: object
      required:
        - id
        - name
        - description
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Beverages
        description:
          type: string
          example: Drinks and bottled water
    CategoryInput:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          example: Snacks
        description:
          type: string
          example: Chips, biscuits, and light bites
    Message:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: delete success
