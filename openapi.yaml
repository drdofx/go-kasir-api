openapi: 3.0.3
info:
  title: Go Kasir API
  version: 1.0.0
  description: Production-oriented POS backend API for catalog, checkout, customers, branches, and reporting.
servers:
  - url: /
security:
  - BearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 6
      responses:
        "200":
          description: Password changed
  /api/v1/auth/switch-branch:
    post:
      tags: [Auth]
      summary: Switch the active branch in the JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id]
              properties:
                branch_id:
                  type: integer
      responses:
        "200":
          description: New branch-scoped token
  /api/v1/users:
    get:
      tags: [Users]
      summary: List users in the system
      description: Requires admin role.
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      tags: [Users]
      summary: Create a user in the authenticated user's organization
      description: Requires admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
  /api/v1/users/{id}:
    put:
      tags: [Users]
      summary: Update user role and permissions
      description: Requires admin role.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  example: admin
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Role updated
  /api/v1/branches:
    get:
      tags: [Branches]
      summary: List branches in the authenticated organization
      description: Requires admin role.
      responses:
        "200":
          description: Branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
    post:
      tags: [Branches]
      summary: Create a branch in the authenticated organization
      description: Requires admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "201":
          description: Branch created
  /api/v1/branches/{id}:
    put:
      tags: [Branches]
      summary: Update a branch in the authenticated organization
      description: Requires admin role.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "200":
          description: Branch updated
  /api/v1/categories:
    get:
      tags: [Categories]
      summary: List categories
      responses:
        "200":
          description: Categories
    post:
      tags: [Categories]
      summary: Create category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
  /api/v1/categories/{id}:
    get:
      tags: [Categories]
      summary: Get category by ID
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Category
    put:
      tags: [Categories]
      summary: Update category
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Category updated
    delete:
      tags: [Categories]
      summary: Delete category
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Category deleted
  /api/v1/products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - name: name
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Products
    post:
      tags: [Products]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
  /api/v1/products/{id}:
    get:
      tags: [Products]
      summary: Get product by ID
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Product
    put:
      tags: [Products]
      summary: Update product
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Product updated
    delete:
      tags: [Products]
      summary: Delete product
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Product deleted
  /api/v1/customers:
    get:
      tags: [Customers]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Customers
    post:
      tags: [Customers]
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Customer created
  /api/v1/customers/{id}/purchases:
    get:
      tags: [Customers]
      summary: Get customer purchase history
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Purchase history
  /api/v1/payment-types:
    get:
      tags: [Payments]
      summary: List payment types
      responses:
        "200":
          description: Payment types
  /api/v1/checkout:
    post:
      tags: [Transactions]
      summary: Create a checkout transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Transaction created
  /api/v1/transactions:
    get:
      tags: [Transactions]
      summary: List transactions
      responses:
        "200":
          description: Transactions
  /api/v1/report/dashboard:
    get:
      tags: [Reports]
      summary: Dashboard report
      responses:
        "200":
          description: Dashboard data
  /api/v1/report/today:
    get:
      tags: [Reports]
      summary: Today's sales summary
      responses:
        "200":
          description: Today's sales summary
  /api/v1/report:
    get:
      tags: [Reports]
      summary: Sales summary for date range
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Sales summary
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        org_id:
          type: integer
        branch_id:
          type: integer
          nullable: true
        created_at:
          type: string
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        name:
          type: string
        role:
          type: string
    Branch:
      type: object
      properties:
        id:
          type: integer
        organization_id:
          type: integer
        name:
          type: string
        code:
          type: string
        address:
          type: string
        created_at:
          type: string
    BranchInput:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
        code:
          type: string
        address:
          type: string
    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    ProductInput:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
        price:
          type: integer
          minimum: 0
        category_id:
          type: integer
          nullable: true
    CustomerInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
    CheckoutRequest:
      type: object
      required: [branch_id, items]
      properties:
        branch_id:
          type: integer
        customer_id:
          type: integer
          nullable: true
        items:
          type: array
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id:
                type: integer
              quantity:
                type: integer
                minimum: 1
        payments:
          type: array
          items:
            type: object
            required: [type, amount]
            properties:
              type:
                type: string
                example: cash
              amount:
                type: integer
                minimum: 1
